[project]
name = "vlla"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Brandon Yang", email = "jqm9ba@virginia.edu" }
]
requires-python = ">=3.11"
dependencies = [
    "lerobot>=0.4.3",
    "loguru>=0.7.0",
    "msgpack>=1.1.2",
    "numpy>=2.4.1",
    "torch>=2.0.0",
    "tqdm>=4.60.0",
    "tyro>=1.0.5",
    "websockets>=15.0",
]

[project.scripts]
vlla = "vlla:main"

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=8.0.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.14",
]
metaworld = [
    "av>=15.0.0,<16.0.0",
    "imageio>=2.37.2",
    "metaworld @ git+https://github.com/Farama-Foundation/Metaworld.git@master",
]

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[tool.ruff.lint]
extend-select = ["I"]

[tool.uv.workspace]
exclude = [
    "clients/libero_client",
]
